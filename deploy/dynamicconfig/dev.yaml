# Temporal dynamic config -- DEVELOPMENT ONLY.
#
# These settings make this POC's behaviour observable on a laptop; none is a
# good production value. All are checked by `make verify-config`, which fails
# if a server upgrade stops recognising the key -- an unregistered key is
# silently ignored.
#
# Retention itself is not tunable here: it has a 1h floor, so truncation is
# demonstrated with `make reap` instead.
# See docs/FINDINGS.md#retention-has-a-one-hour-floor.

# Deletion of a closed execution's data is jittered, landing somewhere in
# [retention, retention + jitter]. Pinned small so it is easy to reason about.
history.retentionTimerJitterDuration:
  - value: 1m

# The Temporal side of the visibility lag (docs/FINDINGS.md#visibility-lag);
# the default is 1s. The other half is Elasticsearch's own
# index.refresh_interval, which Temporal's index template leaves unset --
# bootstrap.sh sets it explicitly.
worker.ESProcessorFlushInterval:
  - value: 100ms

# Search attribute definitions are cached, so for the first ~60s after
# bootstrap.sh registers them the server still answers from the old set and
# every UpsertSearchAttributes fails the workflow task with
# "BadSearchAttributes: search attribute CustomerId is not defined". `make up`
# seeds seconds after bootstrapping, which lands squarely inside that window.
# Reading through the cache costs a lookup per read and is documented as a
# development-only setting.
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
