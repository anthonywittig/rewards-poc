# Temporal dynamic config -- DEVELOPMENT ONLY.
#
# These settings make the POC's behaviour observable on a laptop; none is a
# good production value. An unregistered key is silently ignored (after one
# startup warning), so re-check these names after a server upgrade.

# The Temporal side of the visibility lag; the default is 1s. The other half
# is Elasticsearch's own index.refresh_interval, which bootstrap.sh sets.
worker.ESProcessorFlushInterval:
  - value: 100ms

# Search attribute definitions are cached for ~60s, so right after
# bootstrap.sh registers them the server can still answer from the old set and
# fail every upsert with "BadSearchAttributes: search attribute ... is not
# defined". Reading through the cache is documented as a dev-only setting.
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
