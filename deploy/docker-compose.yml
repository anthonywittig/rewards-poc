# Postgres (persistence) + Elasticsearch (visibility) + Temporal + the workflow
# worker + the HTTP API + the Vite dev server, plus the seed one-shot behind a
# profile. Nothing runs on the host.
#
# Run via the Makefile at the repo root, which points here and loads .env
# (or .env.example when .env is absent).

name: ${COMPOSE_PROJECT_NAME:-rewards-alpha}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
      - xpack.security.enabled=false
      # Absolute-byte watermarks, not percentages: with ES's default 85/90/95%
      # thresholds a nearly-full laptop disk flips indices read-only and
      # visibility silently stops updating while workflows keep running fine.
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      # Not worth the memory for a handful of documents.
      - xpack.ml.enabled=false
      - xpack.monitoring.collection.enabled=false
      - xpack.watcher.enabled=false
      - indices.memory.index_buffer_size=5%
    mem_limit: ${ES_MEM_LIMIT}
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # yellow is fine: single node, and Temporal's index template sets
      # number_of_replicas 0 with auto_expand_replicas 0-2.
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/dev.yaml
      # Ours is created by bootstrap.sh with the retention we want.
      - SKIP_DEFAULT_NAMESPACE_CREATION=true
    ports:
      - "${TEMPORAL_GRPC_PORT}:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
      # The server image ships the `temporal` CLI, so operational scripts run
      # here via `exec`. It has bash, curl and grep but no python3 or jq.
      - ./bootstrap.sh:/bootstrap.sh:ro
      - ./reap.sh:/reap.sh:ro
      - ./reset.sh:/reset.sh:ro
      - ./inspect:/inspect:ro
    healthcheck:
      # The frontend binds the container's own IP, not 127.0.0.1, so localhost
      # is refused here. `hostname -i` gives the address it actually listens on.
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:${TEMPORAL_UI_PORT}
      - TEMPORAL_DEFAULT_NAMESPACE=${TEMPORAL_NAMESPACE}
    ports:
      - "${TEMPORAL_UI_PORT}:8080"

  # Started by `make up` after bootstrap, so it never polls a namespace that
  # doesn't exist yet. `make worker` rebuilds and restarts it after a code
  # change; `make worker-logs` tails it.
  worker:
    build:
      # The repo root: the binary needs cmd/ and internal/, which are above this
      # file. deploy/Dockerfile has the details.
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: worker
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      # In-network, so the service name and the container port -- not the
      # host-published TEMPORAL_GRPC_PORT a host-side `go run` would use.
      - TEMPORAL_HOSTPORT=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE}
    # Survives a Temporal restart and a laptop reboot; `make worker-stop` still
    # holds it down, because `compose stop` is an explicit stop.
    restart: unless-stopped

  # Same shape as the worker, one image apart. `make api` rebuilds and restarts
  # it; `make api-logs` tails it.
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: api
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_HOSTPORT=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE}
      # Fixed inside the container, like every other service here: API_PORT is
      # the host-side knob, applied by the port mapping below, so a second stack
      # publishes a different port without changing what the process binds.
      - API_PORT=8081
    ports:
      - "${API_PORT}:8081"
    healthcheck:
      # /healthz answers from the process alone -- no Temporal call -- so this
      # reports the server being up, which is what `make up --wait` needs before
      # `make seed` can work. Alpine has busybox wget, not curl.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The Vite dev server, with web/ bind-mounted so hot reload still works --
  # editing the UI and watching it update is the whole point of running a dev
  # server rather than serving a build. node_modules lives in a volume instead of
  # the bind mount, so a host-side install and the container's never overwrite
  # each other.
  #
  # No image of its own: it is node plus the repo's own source, and npm install
  # on start is what a dev server does anyway.
  web:
    image: node:${NODE_VERSION}
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Unlike the api, the container binds the published port rather than a
      # fixed one: Vite's hot-reload socket connects back to the port the browser
      # sees, so container and host have to agree on it.
      - WEB_PORT=${WEB_PORT}
      # Vite proxies /api itself, from inside the network, so this is a service
      # name. The Temporal UI link is followed by the browser, so that one is the
      # published port.
      - VITE_API_PROXY_TARGET=http://api:8081
      - VITE_TEMPORAL_UI_URL=http://localhost:${TEMPORAL_UI_PORT}
    volumes:
      - ../web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    # Typecheck before serving, so a type error stops here rather than after the
    # dev server is already up. --host because Vite binds loopback by default,
    # which from outside the container is nothing at all.
    #
    # A type error therefore exits the container, and restart: unless-stopped
    # retries it -- the error stays in `make web-logs` until the source is fixed,
    # and the next retry serves the fix, because the source is a bind mount.
    command: sh -c "npm install && npm run build && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${WEB_PORT}/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      # The first start installs dependencies and builds before it serves.
      start_period: 60s
    restart: unless-stopped

  # A one-shot, not a service: the `tools` profile keeps `compose up` from
  # starting it, and `make seed` runs it with `run --rm`. depends_on carries the
  # ordering, so seeding waits for a healthy API whether it is `make up` running
  # it or `make seed` on its own.
  seed:
    profiles: [tools]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: seed
    depends_on:
      api:
        condition: service_healthy
    environment:
      # In-network, so the container port rather than the published one.
      - API_BASE=http://api:8081
      # Only for the "where to look next" line it prints at the end, which has
      # to name an address the reader can actually open.
      - API_PUBLIC_BASE=http://localhost:${API_PORT}

volumes:
  postgres-data:
  es-data:
  web-node-modules:
