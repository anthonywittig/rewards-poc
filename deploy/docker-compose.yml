# The whole stack: Postgres (persistence) + Elasticsearch (visibility) +
# Temporal + its UI + the workflow worker. Nothing runs on the host.
#
# Run via the Makefile at the repo root. Every value is written here literally
# rather than interpolated from an env file: nothing about this stack varies
# per checkout, so change a port or an image by editing it here.

name: rewards-poc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:7.17.27
    environment:
      - discovery.type=single-node
      # 256m is the practical heap floor.
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      # Absolute-byte watermarks: with ES's default percentage thresholds a
      # nearly-full laptop disk flips indices read-only and visibility
      # silently stops updating while workflows keep running fine.
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      # Not worth the memory for a handful of documents.
      - xpack.ml.enabled=false
      - xpack.monitoring.collection.enabled=false
      - xpack.watcher.enabled=false
      - indices.memory.index_buffer_size=5%
    # Roughly 3x the heap, for JVM overhead and Lucene off-heap use.
    mem_limit: 768m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # yellow is fine on a single node.
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/dev.yaml
      # Ours is created by bootstrap.sh with the retention we want.
      - SKIP_DEFAULT_NAMESPACE_CREATION=true
      # The three below are not read by the server; they are for the scripts
      # mounted below and for `temporal` CLI commands run with `compose exec`,
      # which inherit this environment -- so the namespace is defined once,
      # here. TEMPORAL_NAMESPACE is the name the CLI itself reads.
      - TEMPORAL_NAMESPACE=rewards
      # 1h is Temporal's enforced minimum for namespace retention.
      - TEMPORAL_RETENTION=1h
      # Visibility index refresh, applied to the index by bootstrap.sh.
      - ES_REFRESH_INTERVAL=200ms
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
      # The server image ships the `temporal` CLI, so operational scripts run
      # here via `exec`.
      - ./bootstrap.sh:/bootstrap.sh:ro
      - ./reset.sh:/reset.sh:ro
    healthcheck:
      # The frontend binds the container's own IP, not 127.0.0.1, so localhost
      # is refused here.
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.53.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
      - TEMPORAL_DEFAULT_NAMESPACE=rewards
    ports:
      - "8080:8080"

  # Started by `make up` after bootstrap, so it never polls a namespace that
  # doesn't exist yet. `make worker` rebuilds and restarts it after a code
  # change; `make logs SVC=worker` tails it.
  worker:
    build:
      # The repo root: the binary needs cmd/ and internal/, which are above
      # this file.
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      # In-network, so the service name and the container port -- not the
      # published 7233 a host-side `go run` would use.
      - TEMPORAL_HOSTPORT=temporal:7233
      - TEMPORAL_NAMESPACE=rewards
    # Survives a Temporal restart; `make worker-stop` still holds it down,
    # because `compose stop` is an explicit stop.
    restart: unless-stopped

volumes:
  postgres-data:
  es-data:
