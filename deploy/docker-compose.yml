# The whole stack: Postgres (persistence) + Elasticsearch (visibility) +
# Temporal + its UI + the worker + the HTTP API + the Vite dev server, plus
# the seed one-shot behind a profile. Nothing runs on the host.
#
# Run via the Makefile at the repo root. Every value is written here
# literally; change a port or an image by editing it here.

name: rewards-poc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:7.17.27
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      # Absolute-byte watermarks: with ES's default percentage thresholds a
      # nearly-full laptop disk flips indices read-only and visibility
      # silently stops updating.
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - xpack.ml.enabled=false
      - xpack.monitoring.collection.enabled=false
      - xpack.watcher.enabled=false
      - indices.memory.index_buffer_size=5%
    mem_limit: 768m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # yellow is fine on a single node.
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/dev.yaml
      # Ours is created by bootstrap.sh with the retention we want.
      - SKIP_DEFAULT_NAMESPACE_CREATION=true
      # The three below are read by the mounted scripts and by `temporal` CLI
      # commands run with `compose exec`, not by the server itself.
      - TEMPORAL_NAMESPACE=rewards
      # 1h is Temporal's enforced minimum for namespace retention.
      - TEMPORAL_RETENTION=1h
      # Visibility index refresh, applied by bootstrap.sh (the index would
      # otherwise inherit Elasticsearch's 1s default).
      - ES_REFRESH_INTERVAL=200ms
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
      - ./bootstrap.sh:/bootstrap.sh:ro
    healthcheck:
      # The frontend binds the container's own IP, so localhost is refused.
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.53.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
      - TEMPORAL_DEFAULT_NAMESPACE=rewards
    ports:
      - "8080:8080"

  worker:
    build:
      # The repo root: the binary needs cmd/ and internal/, which are above
      # this file.
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: worker
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      # In-network: the service name and container port.
      - TEMPORAL_HOSTPORT=temporal:7233
      - TEMPORAL_NAMESPACE=rewards
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: api
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_HOSTPORT=temporal:7233
      - TEMPORAL_NAMESPACE=rewards
      - API_PORT=8081
      # Ends up in response deep links, which the browser follows -- so the
      # published address, not the in-network one.
      - TEMPORAL_UI_URL=http://localhost:8080
    ports:
      - "8081:8081"
    healthcheck:
      # /healthz answers from the process alone, which is what `make up
      # --wait` needs before seeding. Alpine has busybox wget, not curl.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The Vite dev server, with web/ bind-mounted so hot reload works.
  # node_modules lives in a volume so a host-side install and the container's
  # never overwrite each other.
  web:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The container binds the published port: Vite's hot-reload socket
      # connects back to the port the browser sees.
      - WEB_PORT=5173
      # Vite proxies /api from inside the network, so this is a service name.
      # Temporal UI links come pre-built in API responses, so the web service
      # needs no Temporal configuration at all.
      - VITE_API_PROXY_TARGET=http://api:8081
    volumes:
      - ../web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    # --host because Vite binds loopback by default, which from outside the
    # container is nothing at all.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    healthcheck:
      # 127.0.0.1, not localhost: --host 0.0.0.0 binds IPv4 only, and a
      # resolver answering ::1 first would probe a port nothing listens on.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      # A first start installs npm packages over a bind mount, which is
      # minutes on Docker Desktop.
      start_period: 180s
    restart: unless-stopped

  # A one-shot: the `tools` profile keeps `compose up` from starting it, and
  # `make up` runs it with `run --rm`.
  seed:
    profiles: [tools]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: seed
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_BASE=http://api:8081
      # Only for the "where to look next" line printed at the end.
      - API_PUBLIC_BASE=http://localhost:8081

volumes:
  postgres-data:
  es-data:
  web-node-modules:
